services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: journal
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      # Executado apenas na PRIMEIRA inicialização do volume.
      # Para reaplicar: make reset
      - ./migrations:/docker-entrypoint-initdb.d:ro
    # Limites fixos para que as medições de antes/depois sejam comparáveis.
    # Ajuste para sua máquina, mas registre no journal se mudar.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DB_DSN: app:app@tcp(mysql:3306)/journal?parseTime=true
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512m

volumes:
  mysql-data:
